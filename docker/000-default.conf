<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/web

    <Directory /var/www/html/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Secure the Drupal private files directory from direct HTTP access
    <Directory /var/www/html/private>
        Require all denied
    </Directory>

    # Secure exported YAML configuration files from direct HTTP access
    <Directory /var/www/html/config>
        Require all denied
    </Directory>

    # Set generous timeouts for long-running Drush or Apigee sync processes
    Timeout 300

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
